networks:
  studyflow-net:
    driver: bridge

services:
  ollama:
    image: ollama/ollama:latest
    container_name: studyflow-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - studyflow-net
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  ollama-pull:
    image: ollama/ollama:latest
    container_name: studyflow-ollama-pull
    environment:
      - OLLAMA_HOST=http://ollama:11434
    entrypoint: ["ollama", "pull", "qwen2.5:1.5b"]
    networks:
      - studyflow-net
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  ai-service:
    build: ./ai-service
    container_name: studyflow-ai-service
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_URL=http://ollama:11434/api/generate
      - OLLAMA_MODEL=qwen2.5:1.5b
    volumes:
      - ./ai-service:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - studyflow-net
    depends_on:
      ollama:
        condition: service_healthy
    restart: unless-stopped

volumes:
  ollama_data: